name: Dependency Review

on: [pull_request]

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    # Dependency review requires GitHub Advanced Security, which is not
    # available for user-owned private repositories. Skip on private repos so
    # PRs are not blocked; this job runs automatically once the repo is public
    # (or org-owned with GHAS).
    if: ${{ github.event.repository.private == false }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          # Block pull requests with vulnerabilities at low severity or higher
          fail-on-severity: low
          # Post detailed summary in PR comments
          comment-summary-in-pr: on-failure
